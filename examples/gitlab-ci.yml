stages:
  - test
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA
  # Baked into the static build (see Dockerfile). Set these as CI/CD variables of the
  # project rather than here, so the pipeline file stays free of deployment values.
  # PUBLIC_COMPANY_NAME: "Some Org GmbH"
  # PUBLIC_API_BASE: ""
  # Only if you host the plugins yourself — pass them on as further --build-arg lines:
  # PUBLIC_PLUGIN_CLAUDE_REPO / _RAW, PUBLIC_PLUGIN_COPILOT_REPO / _RAW,
  # PUBLIC_PLUGIN_OPENCODE_REPO / _RAW (see .env.example for the format).

test:
  stage: test
  image: node:24-alpine
  script:
    - npm ci
    - npm test

build_image:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build
        --build-arg PUBLIC_COMPANY_NAME="$PUBLIC_COMPANY_NAME"
        --build-arg PUBLIC_API_BASE="$PUBLIC_API_BASE"
        -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_to_k8s:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - cd kustomize
    - kustomize edit set image tokendashboard-frontend=$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA
    - kubectl apply -k .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
